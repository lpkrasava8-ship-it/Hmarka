<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для моєї Хмарки ☁️</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        /* --- ОСНОВНА ПАЛІТРА ТА ФОН --- */
        :root {
            --primary: #d81b60;
            --secondary: #ff80ab;
            --text-main: #4a3b3b;
        }

        body {
            margin: 0;
            padding: 0;
            /* Ніжний рухомий фон */
            background: linear-gradient(135deg, #fce4ec, #fffbf0, #ffe4e1, #fff0f5);
            background-size: 300% 300%;
            animation: gradientShift 18s ease infinite;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- ЧАСТИНКИ ТА ХМАРИНКИ --- */
        #particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            animation: floatUp linear forwards;
            opacity: 0;
            will-change: transform, opacity;
        }
