<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для моєї Хмарки ☁️</title>
    <style>
        :root {
            --bg-color: #fdf2f2;
            --accent-color: #d63384;
            --text-color: #4a4a4a;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif; /* Більш романтичний, класичний шрифт */
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        .card {
            background: white;
            max-width: 650px;
            width: 90%;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid #fce4ec;
            margin: 20px 0;
        }

        h1 {
            color: var(--accent-color);
            font-size: 2.2rem;
            margin-bottom: 20px;
            font-weight: normal;
        }

        .message {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 30px;
            font-style: italic;
        }

        /* Контейнер для відео */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #a1a1a1;
        }

        /* Декор: легкі сердечка на фоні */
        .floating-heart {
            position: fixed;
            color: #ffc1e3;
            user-select: none;
            z-index: -1;
            animation: float 10s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Для моєї Хмарки ☁️</h1>
    
    <div class="message">
        <p>З 8 березня, рідна! Ми разом вже трохи більше 10 місяців, і кожен цей день для мене особливий. 
        Ти знаєш, я не завжди можу знайти такі красиві слова, як у фільмах...</p>
        
        <p>Але цей момент дуже нагадує мені те, що я відчуваю до тебе. Просто послухай.</p>
    </div>

    <div class="video-container">
        <iframe 
            src="https://www.youtube.com/embed/5Yh3tR8yG3k?start=4190&rel=0&modestbranding=1" 
            title="Green Book Scene"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

    <div class="footer">
        Твій (Твоє ім'я) ❤️
    </div>
</div>

<script>
    function createHeart() {
        const heart = document.createElement('div');
        heart.className = 'floating-heart';
        heart.innerHTML = '❤';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
        heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
        document.body.appendChild(heart);
        
        setTimeout(() => { heart.remove(); }, 10000);
    }
    setInterval(createHeart, 500);
</script>

</body>
</html>
