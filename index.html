<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для моєї Хмарки</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            width: 90%;
            padding: 20px;
            z-index: 10;
        }

        h1 {
            font-size: clamp(28px, 5vw, 40px);
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        p {
            font-size: clamp(16px, 3vw, 18px);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Стилі для відеоплеєра */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            background: #000;
            margin-top: 20px;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Анімація сердечок */
        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            color: white;
            opacity: 0.7;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Для моєї Хмарки ☁️</h1>
    <p>З 8 березня, моя любов. Ти для мене — особливий світ.</p>
    
    <div class="video-wrapper">
        <iframe 
            id="loveVideo"
            src="https://www.youtube.com/embed/5Yh3tR8yG3k?start=4190&autoplay=1&mute=0&rel=0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>
</div>

<div class="hearts" id="hearts"></div>

<script>
    // Створення сердечок
    function createHeart() {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️"; // Можна замінити на ☁️ для Хмарки
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 10 + "px";
        heart.style.animationDuration = 4 + Math.random() * 4 + "s";
        document.getElementById("hearts").appendChild(heart);

        setTimeout(() => { heart.remove() }, 8000);
    }

    setInterval(createHeart, 400);

    // Спроба "змусити" відео грати, якщо браузер блокує звук
    document.body.addEventListener('click', function() {
        const iframe = document.getElementById('loveVideo');
        // Перезавантажуємо src для активації звуку після взаємодії
        if (!iframe.src.includes('played=true')) {
            iframe.src += "&played=true";
        }
    }, { once: true });
</script>

</body>
</html>
