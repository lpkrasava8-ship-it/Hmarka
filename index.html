<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для моєї Хмарки ☁️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           ОСНОВНІ НАЛАШТУВАННЯ ТА ЗМІННІ КОЛЬОРІВ
           ========================================= */
        :root {
            --bg-top: #ffdde1;    /* Ніжно-рожевий */
            --bg-bottom: #ee9ca7; /* Теплий персиковий */
            --text-dark: #5a4b4b;
            --heart-color: #ff4d6d;
            --envelope-bg: #fffbfb;
            --envelope-flap: #fdf1f1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Ховаємо скрол */
            position: relative;
        }

        /* =========================================
           БАГАТОШАРОВИЙ ФОН: ХМАРИНКИ
           ========================================= */
        .clouds-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }

        .cloud-svg {
            position: absolute;
            fill: #ffffff;
            animation: floatClouds linear infinite;
        }

        /* Різні розміри та швидкість хмаринок */
        .cloud-1 { top: 10%; left: -20%; width: 150px; animation-duration: 40s; opacity: 0.8; }
        .cloud-2 { top: 30%; left: -20%; width: 250px; animation-duration: 60s; opacity: 0.5; }
        .cloud-3 { top: 60%; left: -20%; width: 180px; animation-duration: 45s; opacity: 0.7; }
        .cloud-4 { top: 80%; left: -20%; width: 300px; animation-duration: 75s; opacity: 0.4; }

        @keyframes floatClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(120vw); }
        }

        /* =========================================
           КОНВЕРТ ТА ЛИСТІВКА (ІНТЕРАКТИВ)
           ========================================= */
        .wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 700px;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .envelope {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 300px;
            background: var(--envelope-bg);
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: transform 0.4s ease;
        }

        .envelope:hover {
            transform: translateY(-5px);
        }

        /* Передня частина конверта */
        .envelope::before {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            border-left: 250px solid transparent;
            border-right: 250px solid transparent;
            border-bottom: 150px solid #f9e9e9;
            z-index: 3;
            border-radius: 0 0 10px 10px;
        }

        /* Верхній клапан конверта */
        .flap {
            position: absolute;
            top: 0; left: 0;
            border-left: 250px solid transparent;
            border-right: 250px solid transparent;
            border-top: 150px solid var(--envelope-flap);
            z-index: 4;
            transform-origin: top;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 10px 10px 0 0;
        }

        /* Напис на закритому конверті */
        .click-text {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            font-family: 'Great Vibes', cursive;
            font-size: 2rem;
            color: var(--heart-color);
            pointer-events: none;
            text-shadow: 1px 1px 3px rgba(255,255,255,0.8);
            animation: pulseText 2s infinite;
        }

        @keyframes pulseText {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
        }

        /* Сам лист всередині */
        .letter {
            position: absolute;
            bottom: 0;
            left: 5%;
            width: 90%;
            height: 90%;
            background: #fff;
            border-radius: 8px;
            z-index: 2;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1), height 1s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            padding: 3
